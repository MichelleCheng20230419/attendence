<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>年级管理 - 武汉一中管理平台</title>
  <link rel="stylesheet" href="/style.css?v=3.16.0">
  <style>
      /* 页头与返回按钮样式统一由 style.css 提供（.page-head / .back-link） */
      .action-bar { display: flex; gap: 10px; flex-wrap: wrap; }

      /* 标签页 */
      .admin-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        border-bottom: 2px solid var(--border);
      }
      .admin-tab {
        padding: 10px 20px;
        border: none;
        background: none;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-light);
        cursor: pointer;
        border-bottom: 3px solid transparent;
        margin-bottom: -2px;
      }
      .admin-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

      .admin-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        gap: 12px;
        flex-wrap: wrap;
      }
      .admin-head .filters { display: flex; gap: 10px; flex-wrap: wrap; }
      .admin-head select {
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 13px;
        background: #fff;
        outline: none;
      }
      .admin-panel {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        padding: 20px;
      }
      .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
      .admin-table th {
        background: var(--bg);
        color: var(--text-light);
        font-weight: 600;
        font-size: 13px;
        text-align: left;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      .admin-table td { padding: 12px 14px; border-bottom: 1px solid #F0F2F5; vertical-align: middle; }
      .admin-table tbody tr:hover { background: #FAFCFE; }
      .admin-table tbody tr:last-child td { border-bottom: none; }
      .admin-table .td-actions { text-align: right; white-space: nowrap; }
      .tag { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; color: #fff; }
      .tag.active  { background: var(--success); }
      .tag.archived { background: var(--pending); color: #666; }
      /* 角色标签：管理员蓝 / 教师绿 / 学生紫 / 班长青 */
      .tag.admin   { background: #2563eb; }
      .tag.teacher { background: #10b981; }
      .tag.student { background: #8b5cf6; }
      .tag.monitor { background: #06b6d4; }
      .btn-text {
        background: none; border: none; font-size: 13px; cursor: pointer; padding: 4px 6px; border-radius: 4px;
      }
      .btn-text.edit { color: var(--primary); }
      .btn-text.edit:hover { background: var(--primary-light); }
      .btn-text.del { color: var(--danger); }
      .btn-text.del:hover { background: #FFF1F0; }
      .user-menu { position: relative; }

      /* 学年管理 */
      .year-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        padding: 20px;
        margin-bottom: 16px;
      }
      .year-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
      .year-current { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; }
      .year-current .val { font-size: 18px; font-weight: 700; color: var(--primary); }
      .wizard-step { margin-bottom: 14px; font-size: 14px; color: var(--text); }
      .wizard-step label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-light); }
      .radio-row { display: flex; gap: 18px; flex-wrap: wrap; margin: 8px 0; }
      .radio-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text); }
      .wizard-mode-desc { font-size: 12px; color: var(--text-light); margin: 6px 0 10px; }
    </style>
</head>
<body>

<header class="navbar" id="navbarHost"></header>

  <div class="container">
    <section class="page-card">
    <!-- 统一页头：返回按钮在左上角、页面标题居中、功能按钮靠右 -->
    <div class="page-head">
      <button id="btnBack" class="back-link"><span class="back-arrow">←</span> 返回签到</button>
      <h2 class="page-title">🏫 年级管理</h2>
    </div>

    <!-- ================= 年级管理 ================= -->
        <div id="tabGrades" class="admin-tab-panel">
          <div class="admin-head">
            <h2>年级管理</h2>
            <div class="action-bar">
              <select id="gradeYearFilter"><option value="">全部学年</option></select>
              <button id="btnImportGrade" class="btn btn-secondary">📤 导入年级</button>
              <button id="btnAddGrade" class="btn btn-primary">＋ 添加年级</button>
            </div>
          </div>
          <div class="admin-panel">
            <div class="plan-table-wrap">
              <table class="admin-table">
                <thead>
                  <tr><th>年级名称</th><th>年级代码</th><th>学年</th><th>班级数</th><th>学生数</th><th class="td-actions">操作</th></tr>
                </thead>
                <tbody id="gradeList"></tbody>
              </table>
            </div>
          </div>
        </div>
    </section><!-- /.page-card -->
  </div>

  <div id="gradeModal" class="modal hidden">
    <div class="modal-box">
      <h3 id="gradeModalTitle">添加年级</h3>
      <div class="form-row"><label>年级名称 *</label><input type="text" id="gName" maxlength="50" placeholder="如 一年级"></div>
      <div class="form-row"><label>年级代码</label><input type="text" id="gCode" maxlength="20" placeholder="如 G1"></div>
      <div class="form-row" id="gYearRow"><label>学年 *</label><input type="text" id="gYear" maxlength="9" placeholder="如 2026-2027"></div>
      <div id="gError" class="import-preview err hidden"></div>
      <div class="modal-actions">
        <button id="gCancel" class="btn btn-secondary">取消</button>
        <button id="gSubmit" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <div id="gradeImportModal" class="modal hidden">
    <div class="modal-box">
      <h3>📤 导入年级</h3>
      <p class="hint">Excel 模板列：年级名称、年级代码、学年</p>
      <input type="file" id="gradeImportFile" accept=".xlsx,.xls">
      <div id="gradeImportResult" class="import-preview"></div>
      <div class="modal-actions">
        <button id="gradeImportCancel" class="btn btn-secondary">取消</button>
        <button id="gradeImportSubmit" class="btn btn-primary">导入</button>
      </div>
    </div>
  </div>

  <div id="confirmModal" class="modal hidden">
    <div class="modal-box confirm-box">
      <h3 id="confirmTitle">提示</h3>
      <p id="confirmMessage" class="confirm-message"></p>
      <div class="modal-actions">
        <button id="confirmCancel" class="btn btn-secondary">取消</button>
        <button id="confirmOk" class="btn btn-danger">确定</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>window.ADMIN_PAGE = 'grades';</script>
  <script src="/navbar.js?v=3.20.0"></script>
  <script src="/admin.js?v=3.17.0"></script>
</body>
</html>

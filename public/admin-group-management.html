<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小组管理 - 武汉一中管理平台</title>
  <link rel="stylesheet" href="/style.css?v=3.16.0">
  <style>
      /* 页头与返回按钮样式统一由 style.css 提供（.page-head / .back-link / .page-card） */
      .action-bar { display: flex; gap: 10px; flex-wrap: wrap; }

      .admin-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        gap: 12px;
        flex-wrap: wrap;
      }
      .admin-head h2 { font-size: 15px; font-weight: 800; margin: 0; }
      .admin-panel {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        padding: 20px;
      }
      .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
      .admin-table th {
        background: var(--bg);
        color: var(--text-light);
        font-weight: 600;
        font-size: 13px;
        text-align: left;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      .admin-table td { padding: 12px 14px; border-bottom: 1px solid #F0F2F5; vertical-align: middle; }
      .admin-table tbody tr:hover { background: #FAFCFE; }
      .admin-table tbody tr:last-child td { border-bottom: none; }
      .admin-table .td-actions { text-align: right; white-space: nowrap; }
      .btn-text { background: none; border: none; font-size: 13px; cursor: pointer; padding: 4px 6px; border-radius: 4px; }
      .btn-text.edit { color: var(--primary); }
      .btn-text.edit:hover { background: var(--primary-light); }
      .btn-text.member { color: #10b981; }
      .btn-text.member:hover { background: #E8F9F2; }
      .btn-text.del { color: var(--danger); }
      .btn-text.del:hover { background: #FFF1F0; }

      .perm-badge {
        display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
        background: var(--primary-light); color: var(--primary-dark); margin: 0 4px 4px 0;
      }
      .perm-badge.muted { background: #F2F4F7; color: #6b7280; }
      .member-count { font-weight: 800; color: var(--primary); }

      /* 权限勾选树：一级权限一行（卡片），子权限缩进 24px
         关键：中文文字必须 flex:0 0 auto + white-space:nowrap，
         否则作为 flex 子项会被压缩到"1 个字宽"→ 变成竖排 */
      .perm-tree { display: flex; flex-direction: column; gap: 12px; }          /* 卡片间距统一 12px */
      .perm-page {
        border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: #FCFDFE;
        transition: border-color .15s ease, background .15s ease;
      }
      .perm-page.on { border-color: var(--primary); background: #F7FBFF; }      /* 已勾选的一级权限高亮 */
      .perm-page.locked { opacity: .62; }
      /* 一级权限：加粗 14px，复选框与文字同一行水平对齐 */
      .perm-tree .perm-head {
        display: flex; align-items: center; gap: 8px; margin: 0;
        font-size: 14px; font-weight: 700; color: var(--text); line-height: 20px; cursor: pointer;
      }
      .perm-tree .perm-head input[type="checkbox"] {
        width: 16px; height: 16px; margin: 0; flex: 0 0 auto; accent-color: var(--primary);
      }
      .perm-tree .perm-name { flex: 0 0 auto; white-space: nowrap; }
      .perm-tree .perm-tag { flex: 0 0 auto; font-size: 12px; font-weight: 400; color: var(--text-light); white-space: nowrap; }
      .perm-page.locked .perm-head { cursor: not-allowed; }
      /* 子权限：缩进 24px，常规 13px，横向排列自动换行 */
      .perm-body { margin: 8px 0 0 24px; }
      .perm-actions { display: flex; flex-wrap: wrap; gap: 10px 18px; }
      .perm-tree .perm-chip {
        display: inline-flex; align-items: center; gap: 6px; margin: 0;
        font-size: 13px; font-weight: 400; color: var(--text); line-height: 18px; white-space: nowrap; cursor: pointer;
      }
      .perm-tree .perm-chip input[type="checkbox"] {
        width: 15px; height: 15px; margin: 0; flex: 0 0 auto; accent-color: var(--primary);
      }
      .perm-tree .perm-chip span { flex: 0 0 auto; white-space: nowrap; }
      /* 无子权限的一级权限 / 锁定项：说明文字另起一行并带 └ 分支符号 */
      .perm-desc-line { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; color: var(--text-light); line-height: 18px; }
      .perm-desc-line .perm-branch { flex: 0 0 auto; color: #c3cbd8; }
      .perm-desc-line .perm-desc-text { flex: 1 1 auto; min-width: 0; }
      .perm-tip { font-size: 12px; color: var(--text-light); line-height: 18px; margin-top: 10px; }

      /* 新建/编辑小组弹窗放宽（权限树需要横向空间） */
      .modal-wide { max-width: 760px; }

      /* 成员选择 */
      .member-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
      .member-list { max-height: 320px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
      .member-row {
        display: flex; align-items: center; gap: 10px; padding: 9px 12px; font-size: 14px;
        border-bottom: 1px solid #F0F2F5; cursor: pointer;
      }
      .member-row:last-child { border-bottom: none; }
      .member-row:hover { background: #FAFCFE; }
      .member-row .role-tag { font-size: 12px; color: var(--text-light); }
      .member-row .cls { font-size: 12px; color: var(--text-light); margin-left: auto; }
      .empty-tip { padding: 24px; text-align: center; color: var(--text-light); font-size: 14px; }
  </style>
</head>
<body>

  <!-- 顶部导航栏：由统一组件 navbar.js 渲染（全站同一份） -->
  <header class="navbar" id="navbarHost"></header>

  <div class="container">
    <section class="page-card">
      <!-- 统一页头（卡片内部）：返回(左) · 标题居中 · 功能按钮(右) -->
      <div class="page-head">
        <button id="btnBack" class="back-link"><span class="back-arrow">←</span> 返回签到</button>
        <h2 class="page-title">👥 小组管理</h2>
        <div class="action-bar">
          <button id="btnAddGroup" class="btn btn-primary">＋ 新建小组</button>
        </div>
      </div>

      <div class="admin-head">
        <h2>小组列表</h2>
        <span class="hint" style="font-size:13px;color:var(--text-light)">小组权限是<b>叠加</b>的：成员在原有角色菜单之外，额外获得小组授权的菜单</span>
      </div>

      <div class="admin-panel">
        <div class="plan-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>小组名称</th><th>描述</th><th>权限</th><th>成员数</th><th>创建时间</th><th class="td-actions">操作</th>
              </tr>
            </thead>
            <tbody id="groupList"></tbody>
          </table>
        </div>
        <div id="groupEmpty" class="empty-tip hidden">暂无小组，点击右上角「＋ 新建小组」创建（如：教务组、巡堂组、德育组）</div>
      </div>
    </section>
  </div>

  <!-- 新建 / 编辑小组 -->
  <div id="groupModal" class="modal hidden">
    <div class="modal-box modal-wide">
      <h3 id="groupModalTitle">新建小组</h3>
      <div class="form-row"><label>小组名称 *</label><input type="text" id="gName" maxlength="50" placeholder="如：教务组"></div>
      <div class="form-row"><label>小组描述</label><input type="text" id="gDesc" maxlength="200" placeholder="如：负责教学巡查与教务安排"></div>
      <div class="form-row">
        <label>权限配置（勾选该小组可访问的页面 / 可执行的操作）</label>
        <div id="permTree" class="perm-tree"></div>
        <div class="perm-tip">勾选一级权限会同时勾选它的全部子权限；也可以只勾选某个子权限（会自动带上所属一级权限）。</div>
      </div>
      <div id="gError" class="import-preview err hidden"></div>
      <div class="modal-actions">
        <button id="gCancel" class="btn btn-secondary">取消</button>
        <button id="gSubmit" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 管理成员 -->
  <div id="memberModal" class="modal hidden">
    <div class="modal-box modal-wide">
      <h3>👥 管理成员 · <span id="mmGroupName">--</span></h3>
      <p class="hint">勾选要加入该小组的用户（一个用户可以属于多个小组，权限取并集）。</p>
      <div class="member-toolbar">
        <input type="text" id="mmSearch" placeholder="搜索用户名 / 姓名..." style="flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--border);border-radius:8px">
        <label style="font-size:13px;color:var(--text-light)"><input type="checkbox" id="mmOnlySelected"> 只看已选</label>
        <span id="mmCount" style="font-size:13px;color:var(--text-light)">已选 0 人</span>
      </div>
      <div id="mmList" class="member-list"></div>
      <div id="mmError" class="import-preview err hidden"></div>
      <div class="modal-actions">
        <button id="mmCancel" class="btn btn-secondary">取消</button>
        <button id="mmSubmit" class="btn btn-primary">保存成员</button>
      </div>
    </div>
  </div>

  <div id="confirmModal" class="modal hidden">
    <div class="modal-box confirm-box">
      <h3 id="confirmTitle">提示</h3>
      <p id="confirmMessage" class="confirm-message"></p>
      <div class="modal-actions">
        <button id="confirmCancel" class="btn btn-secondary">取消</button>
        <button id="confirmOk" class="btn btn-danger">确定</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/navbar.js?v=3.20.0"></script>
  <script src="/group-management.js?v=3.11.0"></script>
</body>
</html>

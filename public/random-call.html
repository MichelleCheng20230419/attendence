<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎲 随机点名 - 武汉一中管理平台</title>
  <link rel="stylesheet" href="style.css?v=3.16.0">
  <style>
    /* ============================================================
       🎲 随机点名（独立页面 /random-call）—— 课堂大屏展示优化
       风格：浅灰背景 + 白色圆角卡片 + 蓝色主色，字体整体放大
       ============================================================ */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f7fa;
      color: #1f2937;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
      font-size: 17px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部栏：页头位于统一白色卡片内部（.page-card）；栅格由 style.css 的 .page-head-bar 提供 */
    /* 返回按钮统一使用 style.css 的 .back-link（14px / #666 / 悬停变蓝） */
    .rc-full {
      border: 1px solid #d7deea;
      background: #fff;
      color: #2563eb;
      font-size: 16px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .rc-full:hover { background: #eff5ff; border-color: #2563eb; }

    /* 卡内小节（控制区 / 抽取区 / 记录表）：白底与阴影由 .page-card 提供，小节间用分隔线 */
    .rc-card { padding: 0; }

    /* 控制区 */
    .rc-controls { display: flex; flex-wrap: wrap; gap: 26px; align-items: center; }
    .rc-field { display: flex; align-items: center; gap: 10px; }
    .rc-field > label.rc-label { font-size: 16px; font-weight: 700; color: #4b5563; }
    .rc-select {
      font-size: 17px;
      padding: 11px 14px;
      min-width: 320px;
      border: 1px solid #d7deea;
      border-radius: 10px;
      background: #fff;
      color: #1f2937;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .rc-select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
    .rc-select:disabled { background: #f3f5f9; color: #6b7280; cursor: not-allowed; }

    .rc-seg { display: inline-flex; border: 1px solid #d7deea; border-radius: 10px; overflow: hidden; background: #fff; }
    .rc-seg label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      font-size: 16px;
      font-weight: 700;
      color: #4b5563;
      cursor: pointer;
      transition: all 0.15s ease;
      border-right: 1px solid #eef1f7;
    }
    .rc-seg label:last-child { border-right: none; }
    .rc-seg input { width: 16px; height: 16px; cursor: pointer; }
    .rc-seg label.on { background: #2563eb; color: #fff; }
    .rc-seg label.on input { accent-color: #fff; }
    .rc-seg label.off-disabled { color: #b6bdc9; cursor: not-allowed; }

    .rc-switch { display: inline-flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; color: #4b5563; cursor: pointer; }
    .rc-switch input { width: 20px; height: 20px; accent-color: #2563eb; cursor: pointer; }

    .rc-meta { margin-left: auto; font-size: 16px; color: #6b7280; }
    .rc-meta b { color: #2563eb; font-size: 20px; }

    /* 舞台（核心区域） */
    .rc-stage {
      background: linear-gradient(180deg, #ffffff 0%, #f7fbff 100%);
      border: 2px dashed #c7dcff;
      border-radius: 16px;
      min-height: 46vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 40px 26px;
      text-align: center;
    }
    .rc-name {
      font-size: 82px;
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: 4px;
      color: #2563eb;
      word-break: break-all;
      transition: color 0.2s ease;
    }
    .rc-name.rolling { color: #93b4f5; }
    .rc-name.done { color: #d48806; animation: rcPop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1); }
    .rc-name.idle { color: #2563eb; font-size: 54px; font-weight: 800; }
    @keyframes rcPop {
      0% { transform: scale(0.6); opacity: 0.2; }
      65% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }
    .rc-info { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .rc-chip {
      background: #fffbe6;
      border: 1px solid #ffe0a3;
      color: #a9700b;
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 22px;
      font-weight: 700;
    }
    .rc-chip.hidden { display: none; }
    /* 点赞按钮（班长 / 任课老师 / 班主任 / 管理员可见） */
    .rc-like {
      height: 52px;
      padding: 0 26px;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      background: #f59e0b;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
      transition: background 0.15s ease, transform 0.08s ease;
    }
    .rc-like:hover { background: #d97706; }
    .rc-like:active { transform: scale(0.98); }
    .rc-like:disabled { background: #fcd9a4; cursor: not-allowed; box-shadow: none; }
    .rc-like.hidden { display: none; }
    .rc-like-info {
      align-self: center;
      font-size: 17px;
      font-weight: 700;
      color: #b45309;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 9px 16px;
    }
    .rc-like-info.hidden { display: none; }
    .rc-hint { font-size: 17px; color: #6b7280; min-height: 24px; }
    .rc-hint.warn { color: #d93026; font-weight: 600; }

    .rc-start {
      margin-top: 6px;
      min-width: 340px;
      height: 68px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.28);
      transition: background 0.15s ease, transform 0.08s ease, box-shadow 0.15s ease;
    }
    .rc-start:hover { background: #1d4ed8; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.36); }
    .rc-start:active { transform: translateY(1px) scale(0.995); }
    .rc-start:disabled { background: #9db8ee; box-shadow: none; cursor: not-allowed; }

    /* 点名记录 */
    .rc-records-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .rc-records-head h3 { font-size: 19px; font-weight: 800; margin: 0; color: #1f2937; }
    .rc-records-head .rc-count { font-size: 15px; color: #6b7280; }
    .rc-records-head .spacer { flex: 1; }
    .rc-btn-ghost {
      border: 1px solid #d7deea;
      background: #fff;
      color: #2563eb;
      font-size: 15px;
      font-weight: 700;
      padding: 9px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .rc-btn-ghost:hover { background: #eff5ff; border-color: #2563eb; }

    .rc-table-wrap { max-height: 320px; overflow-y: auto; border: 1px solid #eef1f7; border-radius: 10px; }
    .rc-table-wrap.collapsed { display: none; }
    table.rc-table { width: 100%; border-collapse: collapse; font-size: 16px; }
    table.rc-table thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #eaf2ff;
      color: #1e40af;
      font-weight: 800;
      text-align: left;
      padding: 12px 16px;
      white-space: nowrap;
      border-bottom: 1px solid #d7e5ff;
    }
    table.rc-table tbody td { padding: 11px 16px; border-bottom: 1px solid #f2f5fa; }
    table.rc-table tbody tr:hover { background: #f8fbff; }
    table.rc-table tbody tr:last-child td { border-bottom: none; }
    .rc-empty { padding: 22px 16px; color: #9aa3b0; text-align: center; font-size: 15px; }
    .rc-tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: #eef2ff; color: #4338ca; }
    .rc-tag.absent { background: #fff1f0; color: #cf1322; }

    /* 重置确认弹窗 */
    .rc-modal {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .rc-modal.hidden { display: none; }
    .rc-modal-box {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 18px 48px rgba(16, 24, 40, 0.24);
      padding: 26px 28px;
      width: min(560px, 92vw);
      font-size: 18px;
    }
    .rc-modal-box h3 { margin: 0 0 12px; font-size: 22px; color: #1f2937; }
    .rc-modal-box p { margin: 0 0 20px; color: #4b5563; line-height: 1.7; }
    .rc-modal-actions { display: flex; gap: 12px; justify-content: flex-end; }
    .rc-modal-actions button {
      height: 48px;
      min-width: 120px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid #d7deea;
      background: #fff;
      color: #374151;
    }
    .rc-modal-actions button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .rc-modal-actions button.primary:hover { background: #1d4ed8; }

    .rc-toast {
      position: fixed;
      left: 50%;
      bottom: 42px;
      transform: translateX(-50%);
      background: rgba(31, 41, 55, 0.94);
      color: #fff;
      font-size: 17px;
      padding: 13px 22px;
      border-radius: 10px;
      z-index: 60;
      transition: opacity 0.2s ease;
    }
    .rc-toast.hidden { opacity: 0; pointer-events: none; }

    @media (max-width: 900px) {
      .rc-name { font-size: 58px; }
      .rc-select { min-width: 100%; }
      .rc-meta { margin-left: 0; }
    }
  </style>
</head>
<body>

  <!-- 顶部导航栏：由统一组件 navbar.js 渲染（全站同一份） -->
  <header class="navbar" id="navbarHost"></header>

  <div class="container">
    <section class="page-card">
      <!-- 统一页头（卡片内部）：返回(左) · 标题居中 · 功能按钮(右) -->
      <div class="page-head-bar">
        <button id="btnBack" class="back-link rc-back"><span class="back-arrow">←</span> 返回签到</button>
        <h2 class="rc-title page-title">🎲 随机点名</h2>
        <div class="action-bar">
          <button id="btnFull" class="rc-full" title="全屏展示（教室投影）">⛶ 全屏</button>
        </div>
      </div>

    <!-- 小节一：控制区 -->
    <section class="rc-card rc-controls">
      <div class="rc-field">
        <label class="rc-label" for="rcClass">班级</label>
        <select id="rcClass" class="rc-select"></select>
      </div>
      <div class="rc-field">
        <label class="rc-label" for="rcSubject">学科</label>
        <select id="rcSubject" class="rc-select" style="min-width:150px"></select>
      </div>
      <div class="rc-field">
        <span class="rc-label">范围</span>
        <div class="rc-seg" id="rcScopeSeg">
          <label id="rcScopeAllLab" class="on"><input type="radio" name="rcScope" id="rcScopeAll" value="all" checked> 全班</label>
          <label id="rcScopeAbsentLab"><input type="radio" name="rcScope" id="rcScopeAbsent" value="absent"> 仅未签到学生</label>
        </div>
      </div>
      <label class="rc-switch" for="rcNoRepeat">
        <input type="checkbox" id="rcNoRepeat" checked> 不重复抽取（本次课已点过的不再抽到）
      </label>
      <span class="rc-meta" id="rcMeta">—</span>
    </section>

    <!-- 点名舞台 -->
    <section class="rc-card rc-stage">
      <div id="rcName" class="rc-name idle">🎯 点击开始点名</div>
      <div class="rc-info">
        <div id="rcChipNo" class="rc-chip hidden">学号：—</div>
        <div id="rcChipSeat" class="rc-chip hidden">座位：—</div>
        <button id="rcLike" class="rc-like hidden" title="为该同学的课堂表现点赞（记录到本学科；班长/任课老师/班主任/管理员可用）">👍 点赞</button>
        <div id="rcLikeInfo" class="rc-like-info hidden">本学科 — 赞</div>
      </div>
      <div id="rcHint" class="rc-hint">将随机抽取一名同学</div>
      <button id="rcStart" class="rc-start">开始点名</button>
    </section>

    <!-- 点名记录 -->
    <section class="rc-card">
      <div class="rc-records-head">
        <h3>📋 点名记录</h3>
        <span class="rc-count" id="rcRecCount">（最近 10 条）</span>
        <select id="rcRecSubject" class="rc-select" style="min-width:140px;padding:8px 10px;font-size:15px">
          <option value="">全部学科</option>
        </select>
        <span class="spacer"></span>
        <button id="rcToggleRecords" class="rc-btn-ghost">折叠</button>
        <button id="rcExport" class="rc-btn-ghost">📤 导出 Excel</button>
      </div>
      <div id="rcTableWrap" class="rc-table-wrap">
        <table class="rc-table">
          <thead>
            <tr><th style="width:150px">时间</th><th>学生姓名</th><th style="width:150px">学号</th><th style="width:120px">座位</th><th style="width:110px">学科</th><th style="width:130px">范围</th><th style="width:170px">操作人</th></tr>
          </thead>
          <tbody id="rcRecBody">
            <tr><td colspan="7" class="rc-empty">暂无点名记录</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    </section><!-- /.page-card -->
  </div>

  <!-- 重置确认 -->
  <div id="rcModal" class="rc-modal hidden">
    <div class="rc-modal-box">
      <h3 id="rcModalTitle">本次课所有学生已点过</h3>
      <p id="rcModalText">是否重置本次课的点名记录，从头开始重新抽取？</p>
      <div class="rc-modal-actions">
        <button id="rcModalCancel">取消</button>
        <button id="rcModalOk" class="primary">重置</button>
      </div>
    </div>
  </div>

  <div id="rcToast" class="rc-toast hidden"></div>

  <script src="/navbar.js?v=3.20.0"></script>
  <script src="random-call.js?v=3.6.0"></script>
</body>
</html>

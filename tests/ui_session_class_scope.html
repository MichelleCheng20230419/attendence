<!DOCTYPE html>
<!--
  无头 Chrome UI 验证：签到操作台「班级隔离」（方案 A / v33：场次归属唯一真源 = session.classId）
    BUG：教师打开签到操作台，看到的是别的班老师/计划发起的签到（且本班学生全被标缺勤）
    ① 别的班（乙班）计划触发的场次：乙班老师看得到；甲班老师看不到（页面提示"当前没有进行中的签到"，卡片全灰）
    ② 「全部班级」计划 → 按班拆场：甲乙两班各自一场（各看各的），绝不共用一个场次
    ③ 手动"发起签到"（教师）= 本班专属场次：别的班（含班长）看不到
    ④ 管理员：签到操作台新增「查看班级」下拉，切换班级后签到数据立即按该班刷新（默认全校视角）
    ⑤ 隔离只是不显示：场次/记录不受影响（另一位老师页面数据完整）
    ⑥ 接口禁用缓存：/api/attendance/status 响应带 Cache-Control: no-store（切换班级不会被浏览器缓存顶回旧班）
  用法（需先启动服务，默认 http://localhost:3000）：
    推荐：.\tests\run-ui.ps1 -Name ui_session_class_scope -AdminPw <管理员密码>
  夹具：1 年级 + 2 班（甲/乙各 2 人）+ 甲乙各一位班主任老师；测完自愈清理（含场次/计划）
-->
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>RUNNING</title>
<style>
  body { font-family: Consolas, monospace; font-size: 13px; padding: 16px; }
  #out { white-space: pre-wrap; }
  #frHost { position: absolute; left: -13000px; top: 0; }
  iframe { border: 0; display: block; width: 1500px; height: 1100px; }
</style>
</head>
<body>
<h3>签到操作台：班级隔离（只看到本班/全校的签到）</h3>
<pre id="out">running…</pre>
<div id="frHost"><iframe id="fr"></iframe></div>
<script>
const out = document.getElementById('out');
const fr = document.getElementById('fr');
const log = (s) => { out.textContent += '\n' + s; };
let pass = 0, fail = 0, skipped = 0;
function check(name, cond, extra) {
  if (cond) { pass++; log('  ✔ ' + name); }
  else { fail++; log('  ✘ ' + name + (extra !== undefined ? ' ' + JSON.stringify(extra) : '')); }
}
function skip(name, why) { skipped++; log('  · 跳过 ' + name + '（' + why + '）'); }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms = 20000) {
  const t0 = Date.now();
  for (;;) { try { if (await fn()) return true; } catch (_) {} if (Date.now() - t0 > ms) return false; await sleep(150); }
}
async function japi(path, { method = 'GET', body } = {}) {
  const res = await fetch(path, {
    method, headers: { 'Content-Type': 'application/json' }, cache: 'no-store',
    body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin',
  });
  let data = null; try { data = await res.json(); } catch (_) {}
  return { status: res.status, data };
}
const F = () => fr.contentDocument;
const W = () => fr.contentWindow;
const Q = (s) => { const d = F(); return d ? d.querySelector(s) : null; };
const Qa = (s) => { const d = F(); return d ? [...d.querySelectorAll(s)] : []; };
const txt = (s) => { const e = Q(s); return e ? e.textContent.replace(/\s+/g, ' ').trim() : ''; };
const hidden = (s) => { const e = Q(s); return !e || e.classList.contains('hidden'); };
async function load(url, waitSel) {
  fr.src = 'about:blank'; await sleep(200);
  fr.src = url;
  await until(() => F() && F().readyState === 'complete' && F().body && (!waitSel || Q(waitSel)), 25000);
  await sleep(1000);
}
async function asUser(u, p = '123456') {
  await japi('/api/auth/logout', { method: 'POST' });
  const r = await japi('/api/auth/login', { method: 'POST', body: { username: u, password: p } });
  if (r.status !== 200) throw new Error('登录失败 ' + u + '：' + r.status);
  return r.data && r.data.user;
}
const cardClasses = () => Qa('.student-card').map((c) => c.className.replace('student-card ', ''));
// 只取"列表模式"的卡片：座位表/作业统计里的卡片同样带 .student-card（seat-card），
// 混在一起会把上一次渲染的座位卡片也数进来 → 断言必须限定在 #studentGrid 内
const listCards = () => Qa('#studentGrid .student-card');
const listCardTexts = () => listCards().map((c) => (c.textContent || '').replace(/\s+/g, ''));
const statOf = (id) => Number(txt(id) || 0);

const stamp = Date.now().toString().slice(-6);
const GRADE = '隔离UI年级' + stamp;
const CA = '隔离UI甲班' + stamp, CB = '隔离UI乙班' + stamp;
const TA = 'scu_ta_' + stamp, TB = 'scu_tb_' + stamp;
const NA = '隔离UI甲老师', NB = '隔离UI乙老师';
const created = { gradeId: null, classIds: [], students: [], users: [], planIds: [], sessionIds: [] };
const now = new Date();
const TODAY = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
const HM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

// 逐班清掉"本班专属的进行中场次"（方案 A 的按班拆场会让一次触发建出多场 → 必须全部登记/清理）
//   ⚠ 2026-09-30 事故加固：这里原来遍历**所有班级**，灰度开启"每天自动签到"后
//    把 10 场真实自动场次（每天 0 点生成、整天 active）全删了。现在：
//     · 只处理**本套件的夹具班级**（created.classIds）
//     · 夹具班级没建成功 → 一律不清理
//     · **绝不删 auto_generated 的场次**（那是生产数据）
async function sweepClassSessions(reason) {
  const targets = (created.classIds || []).map(Number).filter((x) => Number.isInteger(x) && x > 0);
  if (!targets.length) {
    log('  · 安全跳过：夹具班级未创建成功 → 不清理任何场次（避免误删真实场次）');
    return 0;
  }
  let n = 0;
  for (const cid of targets) {
    const rr = await japi('/api/attendance/status?classId=' + cid);
    const s = rr.data && rr.data.session;
    if (!s) continue;
    if (Number(s.classId) !== cid) continue;          // 只处理本班专属场次
    if (s.autoGenerated === true) continue;           // 绝不碰"每天自动签到"场次
    if (s.status !== 'active') continue;
    created.sessionIds.push(s.id);
    log('SESSIONS=' + s.id);
    await dropSession(s.id);
    n += 1;
  }
  if (n) log('  · ' + (reason || '收尾') + '：清理本班专属进行中场次 ' + n + ' 场');
  return n;
}
async function dropSession(sid) {
  if (!sid) return;
  const d = await japi('/api/attendance/sessions/' + sid, { method: 'DELETE' });
  if (d.status === 409) {
    await japi('/api/attendance/sessions/' + sid + '/close', { method: 'POST' });
    await japi('/api/attendance/sessions/' + sid, { method: 'DELETE' });
  }
  created.sessionIds = created.sessionIds.filter((x) => x !== sid);
}
async function currentSessionId() {
  const d = await japi('/api/attendance/status');
  return d.data && d.data.session ? d.data.session.id : null;
}
// 造一条"当前分钟"的计划并等待它触发成场次
async function firePlan(classId) {
  const r = await japi('/api/plans', { method: 'POST', body: { planDate: TODAY, startTime: HM, durationMinutes: 30, classId } });
  if (r.status !== 201) return { error: r.data };
  const inserted = r.data.inserted || 0;
  const st = await japi('/api/attendance/status');
  const sid = st.data && st.data.session ? st.data.session.id : null;
  if (sid) { created.sessionIds.push(sid); log('SESSIONS=' + sid); }
  return { sid, inserted, planStatus: r.status };
}

async function hardCleanup() {
  await asUser('admin');
  for (const sid of [...created.sessionIds]) await dropSession(sid);
  // 清掉夹具班级对应的计划 + 本驱动造的"全部班级"计划（classId=null，按 日期+时间 匹配）
  const plans = (await japi('/api/plans')).data.plans || [];
  for (const p of plans.filter((x) => created.classIds.includes(x.classId)
      || (x.classId === null && x.planDate === TODAY && x.startTime === HM))) {
    await japi('/api/plans/' + p.id, { method: 'DELETE' });
  }
  for (const c of ((await japi('/api/classes?includeArchived=1')).data.classes || []).filter((x) => /^隔离UI[甲乙]班/.test(x.className))) {
    for (const s of ((await japi('/api/students?classId=' + c.id)).data.students || [])) {
      await japi('/api/students/' + s.id, { method: 'DELETE' });
    }
    await japi('/api/classes/' + c.id + '?force=1', { method: 'DELETE' });
  }
  for (const u of ((await japi('/api/users')).data.users || []).filter((x) => /^scu_/.test(x.username))) {
    await japi('/api/users/' + u.id, { method: 'DELETE' });
  }
  for (const g of ((await japi('/api/grades')).data.grades || []).filter((x) => /^隔离UI年级/.test(x.grade_name || x.gradeName || ''))) {
    await japi('/api/grades/' + g.id, { method: 'DELETE' });
  }
}

(async () => {
  try {
    out.textContent = '0) 准备夹具…';
    const lg = await japi('/api/auth/login', { method: 'POST', body: { username: 'admin', password: '123456' } });
    if (lg.status !== 200) throw new Error('管理员登录失败：' + lg.status);
    const year = (await japi('/api/settings')).data.currentAcademicYear;
    created.gradeId = (await japi('/api/grades', { method: 'POST', body: { gradeName: GRADE, gradeCode: 'SCU', academicYear: year } })).data.id;
    const mkClass = async (name) => (await japi('/api/classes', { method: 'POST', body: { className: name, gradeName: GRADE, academicYear: year } })).data.id;
    const ca = await mkClass(CA), cb = await mkClass(CB);
    created.classIds = [ca, cb];
    const mkStu = async (classId, prefix) => {
      for (let i = 1; i <= 2; i += 1) {
        const r = await japi('/api/students', { method: 'POST', body: { studentNo: prefix + stamp + String(i).padStart(2, '0'), name: prefix + '同学' + i, classId, status: '在读' } });
        created.students.push(r.data && (r.data.student ? r.data.student.id : r.data.id));
      }
    };
    await mkStu(ca, 'SCUA'); await mkStu(cb, 'SCUB');
    for (const [u, name, classId] of [[TA, NA, ca], [TB, NB, cb]]) {
      const r = await japi('/api/users', { method: 'POST', body: { username: u, password: '123456', role: 'teacher', realName: name, classId, mustChangePassword: false, profileLocked: true, force: true } });
      created.users.push(r.data.user.id);
    }
    check('0) 夹具就绪（1 年级 + 2 班各 2 人 + 甲乙各一位老师）',
      !!created.gradeId && created.classIds.every(Boolean) && created.students.filter(Boolean).length === 4 && created.users.length === 2);

    // 安全前置：若已有真实进行中的场次，则跳过触发类用例（避免影响真实签到）
    //   用 ?classId=all 走"全校视角"取任意班的最新进行中场次（管理员不带参也是全校视角，
    //   但显式传参更稳，避免日后口径变化再次误判）
    const pre = await japi('/api/attendance/status?classId=all');
    const preActive = pre.data.session;
    const realActive = !!(preActive && preActive.status === 'active' && preActive.createdByName !== NB);
    if (realActive) log('  · 注意：当前已有进行中的场次 #' + preActive.id + '（' + preActive.createdByName + '），触发类用例将跳过');

    // ============================================================
    // 一、别的班（乙班）计划场次：乙班老师看得到，甲班老师看不到
    // ============================================================
    log('\n— 一) 乙班计划场次 —');
    let cbSid = null;
    if (realActive) {
      skip('一) 乙班计划场次隔离', '当前已有真实进行中的场次');
    } else {
      await asUser(TB);
      const fired = await firePlan(cb);
      cbSid = fired.sid;
      check('一) 乙班老师发起计划 → 触发出场次 #' + cbSid, Number.isInteger(cbSid), fired);

      // 乙班老师：看得到，且标注"计划发起：自己"
      fr.style.width = '1500px'; fr.style.height = '1100px';
      await load('/dashboard', '#statLeave');
      await until(() => !hidden('#sessionInfo'), 15000);
      check('一) 乙班老师的操作台显示该场次（本班计划）',
        !hidden('#sessionInfo') && hidden('#sessionScopeTip'), { info: hidden('#sessionInfo'), tip: txt('#sessionScopeTip') });
      check('一) 发起人标注为"计划发起：' + NB + '"（自己的计划，不标"其他老师发起"）',
        /计划发起/.test(txt('#sessionStarter')) && txt('#sessionStarter').includes(NB) && !/其他老师发起/.test(txt('#sessionStarter')),
        txt('#sessionStarter'));

      // 甲班老师：看不到乙班这场（API 侧核对"展示的绝不是乙班场次"；页面上不出现乙班老师姓名）
      await asUser(TA);
      const apiA = await japi('/api/attendance/status');
      const shownId = apiA.data && apiA.data.session ? apiA.data.session.id : null;
      check('一) 甲班老师【看不到】该场次（接口展示的绝不是乙班计划场次 #' + cbSid + '）',
        shownId !== cbSid, { shown: shownId, cb: cbSid });
      await load('/dashboard', '#statLeave');
      await sleep(1200);
      check('一) 页面不出现乙班老师姓名（' + NB + '）——根本不该看到这场签到',
        !txt('body').includes(NB), txt('#sessionStarter'));
      check('一) 页面完全不出现"其他老师发起"字样（也没有隔离提示条，需求：根本不显示）',
        !/其他老师发起/.test(txt('body')) && !Q('#sessionScopeTip'),
        { hasTip: !!Q('#sessionScopeTip'), body: txt('body').slice(0, 80) });
      // 若当天另有【全校场次】（真实使用中常见），页面会正常显示它 → 此时不做"全灰"断言
      if (shownId) {
        skip('一) 甲班老师卡片全灰/统计全 0', '当天另有与本班相关的场次（#' + shownId + '）正在展示，属正常');
      } else {
        check('一) 没有相关场次时：场次信息条隐藏 + 统计全 0 + 卡片全灰',
          hidden('#sessionInfo') && statOf('#statPresent') === 0 && statOf('#statLeave') === 0 &&
          statOf('#statAbsent') === 0 && statOf('#statLate') === 0 &&
          cardClasses().length === 2 && cardClasses().every((c) => /gray/.test(c)),
          { info: hidden('#sessionInfo'), stats: txt('#statPresent') + '/' + txt('#statAbsent'), cards: cardClasses() });
      }
      // 隔离不影响乙班老师页面数据
      await asUser(TB);
      await load('/dashboard', '#statLeave');
      await until(() => !hidden('#sessionInfo'), 15000);
      check('一) 隔离只是"不显示"：乙班老师页面场次信息完整（未被关场/清记录）',
        !hidden('#sessionInfo') && /计划发起/.test(txt('#sessionStarter')), txt('#sessionStarter'));

      // ============================================================
      // 二、「全部班级」计划 → 按班拆场：每班各一场（互不可见、不共用）
      // ============================================================
      log('\n— 二) 全部班级计划（按班拆场） —');
      await asUser('admin');
      await dropSession(cbSid);
      cbSid = null;
      const fired2 = await firePlan(null);   // classId 省略 = 全部班级计划
      check('二) 全部班级计划已创建（inserted=' + fired2.inserted + '）', fired2.inserted === 1, fired2);
      // 逐班核对：服务端按班拆场 → 每个有在读学生的班各拿到自己一场（classId = 本班）
      //   同时把这些场次全部登记下来，保证驱动跑完不留"进行中的别班场次"
      const allClasses = ((await japi('/api/classes')).data.classes || []);
      const perClass = [];
      for (const c of allClasses) {
        const stus = ((await japi('/api/students?classId=' + c.id + '&status=' + encodeURIComponent('在读'))).data.students || []);
        const rr = await japi('/api/attendance/status?classId=' + c.id);
        const s = rr.data && rr.data.session;
        if (stus.length > 0) {
          perClass.push({ classId: c.id, className: c.className, sid: s && s.id, sessionClassId: s && s.classId, studentCount: stus.length });
        }
      }
      for (const x of perClass) { if (x.sid) { created.sessionIds.push(x.sid); log('SESSIONS=' + x.sid); } }
      const badClass = perClass.filter((x) => !x.sid || x.sessionClassId !== x.classId);
      check('二) 全部班级计划 → 每个有在读学生的班各一场专属场次（' + perClass.length + ' 个班）',
        perClass.length > 0 && badClass.length === 0, badClass);
      check('二) 各班场次互不相同（没有"多班共用一场"）',
        new Set(perClass.map((x) => x.sid)).size === perClass.length, perClass);
      // 各班主任各自拿到本班那一场（服务端按 class_id 解析）
      await asUser(TA);
      const stA2 = await japi('/api/attendance/status');
      const sidA = stA2.data && stA2.data.session ? stA2.data.session.id : null;
      await asUser(TB);
      const stB2 = await japi('/api/attendance/status');
      const sidB = stB2.data && stB2.data.session ? stB2.data.session.id : null;
      check('二) 甲班老师拿到的是甲班专属场次（classId=' + ((stA2.data.session || {}).classId) + '）',
        Number.isInteger(sidA) && stA2.data.session.classId === ca, { sidA, session: stA2.data.session });
      check('二) 乙班老师拿到的是乙班专属场次（classId=' + ((stB2.data.session || {}).classId) + '）',
        Number.isInteger(sidB) && stB2.data.session.classId === cb, { sidB, session: stB2.data.session });
      check('二) 两班是【不同的场次】（按班拆场，不再共用一个"全校场次"）', sidA !== sidB, { a: sidA, b: sidB });
      await load('/dashboard', '#statLeave');
      await until(() => !hidden('#sessionInfo'), 15000);
      check('二) 乙班老师页面显示本班场次（计划发起）',
        !hidden('#sessionInfo') && /计划发起/.test(txt('#sessionStarter')), txt('#sessionStarter'));
      await asUser(TA);
      await load('/dashboard', '#statLeave');
      await until(() => !hidden('#sessionInfo'), 15000);
      check('二) 甲班老师页面显示本班场次（不是乙班那场）', !hidden('#sessionInfo'), hidden('#sessionInfo'));
      await asUser('admin');
      for (const x of perClass) await dropSession(x.sid);
      // 兜底：万一触发/清理发生在两次查询之间（例如每分钟调度器恰好触发），再扫一遍并清干净
      await sweepClassSessions('按班拆场收尾');

      // ============================================================
      // 三、手动"发起签到"：归属 = 发起人班级 → 别的班（含班长）看不到
      //     （用户反馈场景：高三1班班长看到"发起：陈璐"）
      // ============================================================
      log('\n— 三) 手动发起（按发起人班级隔离） —');
      await asUser(TB);
      const st = await japi('/api/attendance/start', { method: 'POST', body: { deadlineMinutes: 30 } });
      const manSid = st.data.session.id;
      created.sessionIds.push(manSid);
      log('SESSIONS=' + manSid);
      check('三) 乙班老师手动发起签到 #' + manSid + '（classId=' + st.data.session.classId + '）',
        st.status === 201 && st.data.session.classId === cb, st.data.session);
      await load('/dashboard', '#statLeave');
      await until(() => !hidden('#sessionInfo'), 15000);
      check('三) 发起人自己的页面标注「发起：' + NB + '」', txt('#sessionStarter').includes(NB), txt('#sessionStarter'));
      // 甲班老师：看不到（此前被当成"全校场次"）
      await asUser(TA);
      await load('/dashboard', '#statLeave');
      await sleep(1000);
      check('三) 甲班老师【看不到】乙班老师手动发起的场次（不再当成全校场次）',
        hidden('#sessionInfo') && !txt('#sessionStarter').includes(NB),
        { info: hidden('#sessionInfo'), starter: txt('#sessionStarter') });
      check('三) 页面明确提示「当前没有进行中的签到」',
        /当前没有进行中的签到/.test(txt('#noSessionTip')), txt('#noSessionTip'));
      // 甲班班长：用户反馈的主角 —— 同样看不到
      const monA = 'scu_mon_' + stamp;
      await asUser('admin');                       // 建账号需要管理员权限
      const mr = await japi('/api/users', { method: 'POST', body: { username: monA, password: '123456', role: 'monitor', realName: '隔离UI甲班长', classId: created.classIds[0], mustChangePassword: false, profileLocked: true, force: true } });
      if (!mr.data || !mr.data.user) {
        check('三) 创建甲班班长账号（用于验证班长端隔离）', false, { status: mr.status, data: mr.data });
      } else {
        created.users.push(mr.data.user.id);
        await asUser(monA);
        await load('/dashboard', '#statLeave');
        await sleep(1000);
        check('三) 甲班【班长】也看不到乙班老师发起的签到（班长只应看到本班的签到）',
          hidden('#sessionInfo') && !txt('body').includes(NB),
          { info: hidden('#sessionInfo'), hasName: txt('body').includes(NB) });
        check('三) 班长端显示「当前没有进行中的签到」提示', /当前没有进行中的签到/.test(txt('#noSessionTip')), txt('#noSessionTip'));
      }
      // 乙班老师：仍能看到（含结束后回看自己班）
      await asUser('admin');
      await japi('/api/attendance/sessions/' + manSid + '/close', { method: 'POST' });
      await asUser(TB);
      await load('/dashboard', '#statLeave');
      await until(() => !hidden('#sessionInfo'), 15000);
      check('三) 乙班老师仍可回看自己班刚结束的场次', !hidden('#sessionInfo') && txt('#sessionStarter').includes(NB), txt('#sessionStarter'));
      await asUser('admin');
      await dropSession(manSid);

      // ============================================================
      // 四、管理员：切换「查看班级」→ 签到数据立即刷新 + 接口禁用缓存
      // ============================================================
      log('\n— 四) 管理员切换查看班级 —');
      const raw = await fetch('/api/attendance/status?classId=all', { cache: 'no-store', credentials: 'same-origin' });
      check('四) /api/attendance/status 响应禁止缓存（Cache-Control: no-store）',
        /no-store/.test(raw.headers.get('cache-control') || ''), raw.headers.get('cache-control'));
      await load('/dashboard', '#statLeave');
      await sleep(1200);
      check('四) 签到操作台出现「查看班级」下拉（管理员专用）',
        !!Q('#adminClassSelect') && !hidden('#adminClassWrap'), { has: !!Q('#adminClassSelect'), hidden: hidden('#adminClassWrap') });
      const sel = Q('#adminClassSelect');
      if (sel) {
        // 切到甲班 → 只显示甲班 2 名学生
        sel.value = String(ca);
        sel.dispatchEvent(new (W().Event)('change', { bubbles: true }));
        await until(() => statOf('#statTotal') === 2 && listCardTexts().length === 2, 25000);
        const namesA = listCardTexts();
        check('四) 切到甲班 → 统计总数 = 2，且列表卡片全是甲班（SCUA）学生',
          statOf('#statTotal') === 2 && namesA.length === 2 && namesA.every((t) => /SCUA/.test(t)),
          { total: statOf('#statTotal'), namesA });
        // 切到乙班 → 立即换成乙班 2 名学生（数据确实随班级刷新）
        sel.value = String(cb);
        sel.dispatchEvent(new (W().Event)('change', { bubbles: true }));
        await until(() => {
          const t = listCardTexts();
          return t.length === 2 && t.every((x) => /SCUB/.test(x));
        }, 25000);
        const namesB = listCardTexts();
        check('四) 切到乙班 → 列表卡片立即换成乙班（SCUB）学生（切换班级后数据正确刷新）',
          namesB.length === 2 && namesB.every((t) => /SCUB/.test(t)), namesB);
        // 再切到别班的真实班级（高三1班）→ 卡片必须换成该班学生（不再是甲乙两班夹具学生）
        const realCls = (await japi('/api/classes')).data.classes.find((c) => !created.classIds.includes(c.id));
        if (realCls) {
          sel.value = String(realCls.id);
          sel.dispatchEvent(new (W().Event)('change', { bubbles: true }));
          await until(() => {
            const t = listCardTexts();
            return t.length > 0 && !t.some((x) => /SCUA|SCUB/.test(x));
          }, 25000);
          const namesC = listCardTexts();
          check('四) 切到真实班级「' + realCls.className + '」→ 卡片换成该班学生（' + namesC.length + ' 人）',
            namesC.length > 0 && !namesC.some((t) => /SCUA|SCUB/.test(t)), namesC.slice(0, 3));
          check('四) 切班后统计数据与该班一致（不为 0）', statOf('#statTotal') === namesC.length && namesC.length > 0,
            { total: statOf('#statTotal'), cards: namesC.length });
        }
        // 切回"全部班级（全校视角）"→ 学生数远大于 2
        sel.value = '';
        sel.dispatchEvent(new (W().Event)('change', { bubbles: true }));
        await until(() => statOf('#statTotal') > 2, 25000);
        check('四) 切到「全部班级（全校视角）」→ 显示全校学生（> 2 人）',
          statOf('#statTotal') > 2, statOf('#statTotal'));
      }
    }
  } catch (e) {
    fail++;
    log('  ✘ 异常：' + (e && e.message));
  } finally {
    log('\n— 清理 —');
    try { await hardCleanup(); } catch (e) { log('  · 清理异常：' + e.message); }
    const leftCls = ((await japi('/api/classes?includeArchived=1')).data.classes || []).filter((c) => /^隔离UI[甲乙]班/.test(c.className));
    const leftUsers = ((await japi('/api/users')).data.users || []).filter((u) => /^scu_/.test(u.username));
    const leftPlans = ((await japi('/api/plans')).data.plans || []).filter((p) => created.classIds.includes(p.classId)
      || (p.classId === null && p.planDate === TODAY && p.startTime === HM));
    check('清理：夹具班级/学生/账号/计划已清除',
      leftCls.length === 0 && leftUsers.length === 0 && leftPlans.length === 0,
      { classes: leftCls.length, users: leftUsers.length, plans: leftPlans.length });
  }
  log('\n结果：' + pass + ' 通过 / ' + fail + ' 失败' + (skipped ? ' / ' + skipped + ' 跳过' : ''));
  document.title = (fail === 0 ? 'PASS ' : 'FAIL ') + pass + '/' + (pass + fail);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<!--
  无头 Chrome UI 验证：所有页面返回按钮位置与样式统一
  统一模板：← 返回(左) · 页面标题(居中) · 功能按钮(右)；返回按钮为文字按钮 #666，悬停变蓝；内容区统一内边距 24px；
        点击返回签到操作台（个人中心=上一页；后台管理子页=后台管理首页；补签=来源页）
  用法（需先启动服务，默认 http://localhost:3000）：
    1) Copy-Item tests/ui_back_button.html public/_ui_back_button.html
    2) & "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --disable-gpu `
         --user-data-dir=$env:TEMP\uiBack --virtual-time-budget=300000 --dump-dom `
         "http://localhost:3000/_ui_back_button.html"
    3) 结果：title = "PASS n/n" 或 "FAIL x/n"；用后删除 public/_ui_back_button.html
  夹具：临时年级 + 1 班 + 2 学生 + 管理员/班主任/班长账号；测完清理（自愈式）。
-->
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>RUNNING</title>
<style>
  body { font-family: Consolas, monospace; font-size: 13px; padding: 16px; }
  #out { white-space: pre-wrap; }
  #frHost { position: absolute; left: -13000px; top: 0; }
  iframe { border: 0; display: block; }
</style>
</head>
<body>
<h3>返回按钮统一：左上角 / 样式一致 / 与标题同行对齐 / 跳转正确</h3>
<pre id="out">running…</pre>
<div id="frHost"><iframe id="fr"></iframe></div>
<script>
const out = document.getElementById('out');
const fr = document.getElementById('fr');
const log = (s) => { out.textContent += '\n' + s; };
let pass = 0, fail = 0, skipped = 0;
function check(name, cond, extra) {
  if (cond) { pass++; log('  ✔ ' + name); }
  else { fail++; log('  ✘ ' + name + (extra !== undefined ? ' ' + JSON.stringify(extra) : '')); }
}
function skip(name, why) { skipped++; log('  · 跳过 ' + name + '（' + why + '）'); }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms = 15000) {
  const t0 = Date.now();
  for (;;) { try { if (await fn()) return true; } catch (_) {} if (Date.now() - t0 > ms) return false; await sleep(120); }
}
async function japi(path, { method = 'GET', body } = {}) {
  const res = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' });
  let data = null; try { data = await res.json(); } catch (_) {}
  return { status: res.status, data };
}
const F = () => fr.contentDocument;
const W = () => fr.contentWindow;
const Q = (s) => { const d = F(); return d ? d.querySelector(s) : null; };
const cs = (s, prop) => { const e = Q(s); return e ? W().getComputedStyle(e).getPropertyValue(prop).trim() : null; };
const txt = (s) => { const e = Q(s); return e ? e.textContent.replace(/\s+/g, ' ').trim() : ''; };
const rect = (s) => { const e = Q(s); return e ? e.getBoundingClientRect() : null; };
const visible = (s) => {
  const e = Q(s); if (!e) return false;
  let n = e;
  while (n && n.nodeType === 1) {
    const st = W().getComputedStyle(n);
    if (st.display === 'none' || st.visibility === 'hidden') return false;
    n = n.parentElement;
  }
  const r = e.getBoundingClientRect();
  return r.width > 0 && r.height > 0;
};
const themeColor = () => {
  const hex = W().getComputedStyle(F().documentElement).getPropertyValue('--primary').trim() || '#4A90D9';
  const m = hex.replace('#', '');
  const n = parseInt(m.length === 3 ? m.split('').map((c) => c + c).join('') : m, 16);
  return `rgb(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255})`;
};
async function loadPage(url, waitSel = '#btnBack') {
  fr.src = 'about:blank'; await sleep(150);
  fr.src = url;
  await until(() => F() && F().readyState === 'complete' && F().body && Q(waitSel), 20000);
  await sleep(600);
  // 测试用：关闭过渡，颜色测量才确定
  const st = F().createElement('style');
  st.textContent = '.back-link, .back-link * { transition: none !important; }';
  F().head.appendChild(st);
}
const stamp = Date.now().toString().slice(-6);
const GRADE = '返回年级' + stamp, CLASS = '返回班' + stamp;
const HEAD = 'bk_head_' + stamp, MON = 'bk_mon_' + stamp;
const created = { gradeId: null, classId: null, userIds: [], studentIds: [] };

async function hardCleanup() {
  await japi('/api/auth/logout', { method: 'POST' });
  const lg = await japi('/api/auth/login', { method: 'POST', body: { username: 'admin', password: '123456' } });
  if (lg.status !== 200) return;
  for (const c of ((await japi('/api/classes')).data.classes || []).filter((x) => /^返回班/.test(x.className))) {
    for (const s of ((await japi('/api/students?classId=' + c.id)).data.students || [])) await japi('/api/students/' + s.id, { method: 'DELETE' });
    for (const u of ((await japi('/api/users')).data.users || []).filter((x) => /^bk_/.test(x.username))) {
      await japi('/api/users/teacher-classes', { method: 'POST', body: { teacherId: u.id, classes: [] } });
      await japi('/api/users/' + u.id, { method: 'DELETE' });
    }
    await japi('/api/classes/' + c.id, { method: 'DELETE' });
  }
  if (created.gradeId) await japi('/api/grades/' + created.gradeId, { method: 'DELETE' });
  for (const g of ((await japi('/api/grades')).data.grades || []).filter((x) => /^返回年级/.test(x.grade_name || x.gradeName))) {
    await japi('/api/grades/' + g.id, { method: 'DELETE' });
  }
}

(async () => {
  try {
    out.textContent = '0) 准备夹具…';
    await japi('/api/auth/login', { method: 'POST', body: { username: 'admin', password: '123456' } });
    const year = (await japi('/api/settings')).data.currentAcademicYear;
    created.gradeId = (await japi('/api/grades', { method: 'POST', body: { gradeName: GRADE, gradeCode: 'BKR', academicYear: year } })).data.id;
    created.classId = (await japi('/api/classes', { method: 'POST', body: { className: CLASS, gradeName: GRADE, academicYear: year } })).data.id;
    let r = await japi('/api/users', { method: 'POST', body: { username: HEAD, password: '123456', role: 'teacher', realName: '返回班主任', subject: '语文', classId: created.classId, profileLocked: true, teachingClasses: [{ classId: created.classId, roleInClass: 'head_teacher' }] } });
    created.userIds.push(r.data.user.id);
    r = await japi('/api/users', { method: 'POST', body: { username: MON, password: '123456', role: 'monitor', realName: '返回班长', classId: created.classId, mustChangePassword: false } });
    created.userIds.push(r.data.user.id);
    for (let i = 1; i <= 2; i += 1) {
      const rr = await japi('/api/students', { method: 'POST', body: { studentNo: 'BKR' + stamp + '0' + i, name: '返回同学' + i, classId: created.classId, status: '在读' } });
      created.studentIds.push(rr.data.student.id);
    }
    check('0) 夹具就绪（1 班 2 学生 + 班主任/班长）', created.userIds.length === 2 && created.studentIds.length === 2);
    const asUser = async (u) => { await japi('/api/auth/logout', { method: 'POST' }); return japi('/api/auth/login', { method: 'POST', body: { username: u, password: '123456' } }); };

    fr.style.width = '1420px'; fr.style.height = '900px';

    // ---------- 需要验证的页面（角色 / 路径 / 标题选择器 / 返回目标） ----------
    const pages = [
      { role: 'admin', path: '/students', title: '.page-head .page-title', content: '#studentList', actions: '.action-bar', card: '.page-card', backTo: '/dashboard', label: '学生管理' },
      { role: 'admin', path: '/attendance-analysis', title: '.page-head .page-title', content: '#statCards', actions: '.action-bar', card: '.page-card', backTo: '/dashboard', label: '考勤分析' },
      { role: 'admin', path: '/admin/account-management', title: '.page-head .page-title', content: '#userList', actions: null, card: '.page-card', backTo: '/dashboard', label: '账号管理（独立页）' },
      { role: 'admin', path: '/admin/grade-management', title: '.page-head .page-title', content: '#gradeList', actions: null, card: '.page-card', backTo: '/dashboard', label: '年级管理（独立页）' },
      { role: 'admin', path: '/admin/class-management', title: '.page-head .page-title', content: '#classList', actions: null, card: '.page-card', backTo: '/dashboard', label: '班级管理（独立页）' },
      { role: 'admin', path: '/admin/academic-year-management', title: '.page-head .page-title', content: '#tabYears', actions: null, card: '.page-card', backTo: '/dashboard', label: '学年管理（独立页）' },
      { role: HEAD, path: '/homework', title: '.page-head .page-title', content: '#taskBody', actions: '.action-bar', card: '.page-card', backTo: '/dashboard', label: '作业统计' },
      { role: HEAD, path: '/homework-manage', title: '.page-head .page-title', content: '#taskBody', actions: '.action-bar', card: '.page-card', backTo: '/dashboard', label: '作业管理' },
      { role: HEAD, path: '/announcements', title: '.page-head-bar .page-title', content: '#anBody', actions: '.action-bar', card: '.page-card', backTo: '/dashboard', label: '叫号管理' },
      { role: HEAD, path: '/performance', title: '.page-head-bar .page-title', content: '#pfRecBody', actions: '.action-bar', card: '.page-card', backTo: '/dashboard', label: '课堂表现' },
      { role: HEAD, path: '/random-call', title: '.page-head-bar .page-title', content: '.rc-controls', actions: '.action-bar', card: '.page-card', backTo: '/dashboard', label: '随机点名' },
      { role: HEAD, path: '/admin/student-transfer', title: '.page-head .page-title', content: '#historyBody', actions: '.operator', card: '.page-card', backTo: '/dashboard', label: '学生异动' },
      { role: HEAD, path: '/profile', title: '.page-head .page-title', content: '.profile-grid', actions: null, card: '.page-card', backTo: null, label: '个人中心（返回上一页）' },
      { role: 'admin', path: '/inspection', title: '.page-head .page-title', content: '#issueBody', actions: '.action-bar', card: '.page-card', backTo: '/dashboard', label: '巡堂记录（小组授权页）' },
      { role: 'admin', path: '/admin/group-management', title: '.page-head .page-title', content: '#groupList', actions: '.action-bar', card: '.page-card', backTo: '/dashboard', label: '小组管理（独立页）' },
    ];

    // ---------- A) 每页：位置 / 样式 / 与标题同行 ----------
    for (const p of pages) {
      await asUser(p.role);
      await loadPage(p.path);
      const titleSel = p.title;
      const b = rect('#btnBack');
      const t = rect(titleSel);
      // 统一模板：返回按钮(左) · 标题(居中) · 功能按钮(右)
      // 与"所在页头行"的内容区比较（页头自身的内边距属正常留白）
      const rowEl = Q('#btnBack').parentElement;
      const row = rowEl.getBoundingClientRect();
      const padLeft = parseFloat(W().getComputedStyle(rowEl).paddingLeft) || 0;
      const padRight = parseFloat(W().getComputedStyle(rowEl).paddingRight) || 0;
      check(`A) [${p.label}] 返回按钮在页头左侧、与标题同一行`,
        !!b && !!t && b.left < t.left && b.top < 200 && Math.abs((b.top + b.height / 2) - (t.top + t.height / 2)) <= Math.max(b.height, t.height) / 2 + 1,
        { back: b && [Math.round(b.left), Math.round(b.top)], title: t && [Math.round(t.left), Math.round(t.top)] });
      check(`A) [${p.label}] 返回按钮是页头内容区最左元素（左边距 ≤ 4px）`,
        !!b && b.left - (row.left + padLeft) <= 4,
        { backLeft: b && Math.round(b.left), contentLeft: Math.round(row.left + padLeft) });
      check(`A) [${p.label}] 页面标题在页头居中（标题中心 = 页头内容区中心 ±2px）`,
        !!t && Math.abs((t.left + t.width / 2) - (row.left + padLeft + (row.width - padLeft - padRight) / 2)) <= 2,
        { titleCenter: t && Math.round(t.left + t.width / 2), rowCenter: Math.round(row.left + padLeft + (row.width - padLeft - padRight) / 2) });
      check(`A) [${p.label}] 样式统一（文字按钮 #666、无边框、字号 14px）`,
        cs('#btnBack', 'color') === 'rgb(102, 102, 102)' &&
        cs('#btnBack', 'border-top-style') === 'none' &&
        cs('#btnBack', 'font-size') === '14px',
        { color: cs('#btnBack', 'color'), border: cs('#btnBack', 'border-top-style'), fs: cs('#btnBack', 'font-size') });
      check(`A) [${p.label}] 悬停变蓝（:hover 规则存在）`,
        /\.back-link:hover\s*\{[^}]*var\(--primary\)/.test(await (await fetch('/style.css')).text()));
      // 功能按钮组：靠右（若该页有）
      const actSel = p.actions || null;
      if (actSel && Q(actSel)) {
        const ar = rect(actSel);
        check(`A) [${p.label}] 功能按钮组在页头右侧（右边缘 = 内容区右边缘 ±2px）`,
          Math.abs((row.right - padRight) - ar.right) <= 2,
          { gap: Math.round(row.right - padRight - ar.right) });
      } else {
        skip(`A) [${p.label}] 功能按钮组右对齐`, '该页页头无常驻功能按钮');
      }
      // 关键一致性：返回按钮左边缘必须与"卡片内容区"左边缘对齐（全站统一模板基准）
      const cardEl = Q('.page-card');
      const mainEl = Q(p.content);
      if (cardEl) {
        const cardRect = cardEl.getBoundingClientRect();
        const cardPad = parseFloat(W().getComputedStyle(cardEl).paddingLeft) || 0;
        const contentLeft = cardRect.left + cardPad;
        check(`A) [${p.label}] 返回按钮与卡片内容区左对齐（基准一致）`,
          !!b && Math.abs(b.left - contentLeft) <= 2,
          { backLeft: b && Math.round(b.left), contentLeft: Math.round(contentLeft) });
        // 卡片内边距统一 24px
        check(`A) [${p.label}] 卡片内边距 = 24px`, W().getComputedStyle(cardEl).paddingLeft === '24px',
          W().getComputedStyle(cardEl).paddingLeft);
        // 卡片与浅灰页面背景留白 24px（.container 内边距）
        check(`A) [${p.label}] 卡片与页面背景留白 24px（.container padding 24px）`,
          cs('.container', 'padding-left') === '24px', cs('.container', 'padding-left'));
        // 主体内容同样在卡片内部
        check(`A) [${p.label}] 主体内容（${p.content}）在卡片内部`, !!mainEl && cardEl.contains(mainEl));
      } else {
        skip(`A) [${p.label}] 与卡片内容区对齐`, '未找到 .page-card');
      }
      // 卡片统一：白底 + 圆角 12px + 轻阴影
      if (p.card && Q(p.card)) {
        check(`A) [${p.label}] 卡片统一（白底 / 圆角 12px / 有阴影）`,
          cs(p.card, 'background-color') === 'rgb(255, 255, 255)' &&
          cs(p.card, 'border-radius') === '12px' &&
          cs(p.card, 'box-shadow') !== 'none',
          { bg: cs(p.card, 'background-color'), r: cs(p.card, 'border-radius'), shadow: (cs(p.card, 'box-shadow') || '').slice(0, 30) });
      } else {
        skip(`A) [${p.label}] 卡片样式`, '未找到卡片元素 ' + p.card);
      }
    }
    check('A) 返回按钮文案统一为「← 返回X」', true);

    // ---------- B) 点击返回：目标正确 ----------
    await asUser('admin');
    for (const p of pages.filter((x) => x.backTo)) {
      await loadPage(p.path);
      Q('#btnBack').click();
      const ok = await until(() => W().location.pathname === p.backTo, 8000);
      check(`B) [${p.label}] 点返回 → ${p.backTo}`, ok, W().location.pathname);
    }
    // 个人中心：直接打开（无来源）→ 回签到操作台
    await loadPage('/profile');
    Q('#btnBack').click();
    check('B) [个人中心] 无来源时点返回 → /dashboard',
      await until(() => W().location.pathname === '/dashboard', 8000), W().location.pathname);
    // 个人中心：从签到台进入 → 返回上一页（history.back）
    await loadPage('/dashboard', '#navbarMenus');
    Q('#btnUser') && Q('#btnUser').click();
    await sleep(200);
    W().location.href = '/profile';
    await until(() => F() && F().readyState === 'complete' && Q('#btnBack'), 15000);
    await sleep(500);
    Q('#btnBack').click();
    check('B) [个人中心] 从签到台进入后点返回 → 回到上一页（/dashboard）',
      await until(() => W().location.pathname === '/dashboard', 8000), W().location.pathname);

    // ---------- C) 后台管理子页（4 个独立页面）→ 一律返回签到操作台 ----------
    await asUser('admin');
    await loadPage('/admin/grade-management', '#btnBack');
    check('C) 后台管理子页（年级管理，独立页）按钮文案 = 「← 返回签到」',
      /返回签到/.test(txt('#btnBack')), txt('#btnBack'));
    Q('#btnBack').click();
    await until(() => W().location.pathname === '/dashboard', 8000);
    check('C) 点返回 → 回到签到操作台（/dashboard）',
      W().location.pathname === '/dashboard', W().location.pathname);

    // ---------- D) 计划管理（签到台内视图）返回按钮也统一 ----------
    await asUser('admin');
    await loadPage('/dashboard?view=plans', '#navbarMenus');
    await until(() => visible('#btnBackAttendance'), 8000);
    const pb = rect('#btnBackAttendance');
    const pt = rect('#viewPlans .page-title');
    check('D) 计划管理视图：返回按钮在标题左侧、同一行、左对齐',
      !!pb && !!pt && pb.left < pt.left && Math.abs((pb.top + pb.height / 2) - (pt.top + pt.height / 2)) <= Math.max(pb.height, pt.height) / 2 + 1,
      { back: pb && [Math.round(pb.left), Math.round(pb.top)], title: pt && [Math.round(pt.left), Math.round(pt.top)] });
    check('D) 计划管理视图：返回按钮样式与其它页面一致（#666 文字按钮）',
      cs('#btnBackAttendance', 'color') === 'rgb(102, 102, 102)' && cs('#btnBackAttendance', 'border-top-style') === 'none',
      { color: cs('#btnBackAttendance', 'color') });
    Q('#btnBackAttendance').click();
    await sleep(400);
    check('D) 点返回 → 回到签到视图（#viewAttendance 可见）', visible('#viewAttendance') && !visible('#viewPlans'),
      { att: visible('#viewAttendance'), plans: visible('#viewPlans') });

    // ---------- 清理 ----------
    await hardCleanup();
    const leftUsers = ((await japi('/api/users')).data.users || []).filter((u) => /^bk_/.test(u.username));
    const leftClasses = ((await japi('/api/classes')).data.classes || []).filter((c) => /^返回班/.test(c.className));
    const leftGrades = ((await japi('/api/grades')).data.grades || []).filter((g) => /^返回年级/.test(g.grade_name || g.gradeName));
    check('清理：临时账号/班级/年级已删除', leftUsers.length === 0 && leftClasses.length === 0 && leftGrades.length === 0,
      { u: leftUsers.length, c: leftClasses.length, g: leftGrades.length });
  } catch (e) {
    fail++;
    log('  ✘ 异常：' + (e && e.message));
    try { await hardCleanup(); log('  · 已执行自愈式清理'); } catch (_) {}
  }
  log('\n结果：' + pass + ' 通过 / ' + fail + ' 失败 / ' + skipped + ' 跳过');
  document.title = (fail === 0 ? 'PASS ' : 'FAIL ') + pass + '/' + (pass + fail);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<!--
  无头 Chrome UI 验证：管理员发布作业 + 作业提交情况卡片式改版
  一、管理员发布作业
    ① 作业管理页对管理员显示「管理员模式：以任课老师身份发布」提示
    ② 发布弹窗：任意班级多选（全部班级）+ 学科下拉任选 + 标题 + 截止时间
    ③ 发布成功后列表出现该作业，并标注「管理员发布」
    ④ 提交情况信息卡里「发布老师」= 当前管理员账号（带"管理员"标识）
    ⑤ 班长端能看到发到本班的作业（接口核对）
  二、提交情况卡片式 UI
    ⑥ 作业信息卡（标题 + 班级/学科/发布老师/截止时间/状态字段）
    ⑦ 4 张统计卡：应交（蓝）/已交（绿）/未交（红）/提交率（按数值变色）
    ⑧ 明细表：表头 序号/学号/姓名/状态/提交时间；状态彩色标签；每页 20 条 + 分页
    ⑨ 导出按钮在右上角；「← 返回作业管理」可关闭返回
  用法（需先启动服务，默认 http://localhost:3000）：
    推荐：.\tests\run-ui.ps1 -Name ui_admin_homework -AdminPw <管理员密码>
  夹具：1 年级 + 2 班（甲班 25 人 / 乙班 1 人）+ 班长账号 + 1 条管理员发布的作业；测完清理（自愈式）
-->
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>RUNNING</title>
<style>
  body { font-family: Consolas, monospace; font-size: 13px; padding: 16px; }
  #out { white-space: pre-wrap; }
  #frHost { position: absolute; left: -13000px; top: 0; }
  iframe { border: 0; display: block; width: 1360px; height: 900px; }
</style>
</head>
<body>
<h3>管理员发布作业 + 提交情况卡片式改版</h3>
<pre id="out">running…</pre>
<div id="frHost"><iframe id="fr"></iframe></div>
<script>
const out = document.getElementById('out');
const fr = document.getElementById('fr');
const log = (s) => { out.textContent += '\n' + s; };
let pass = 0, fail = 0, skipped = 0;
function check(name, cond, extra) {
  if (cond) { pass++; log('  ✔ ' + name); }
  else { fail++; log('  ✘ ' + name + (extra !== undefined ? ' ' + JSON.stringify(extra) : '')); }
}
function skip(name, why) { skipped++; log('  · 跳过 ' + name + '（' + why + '）'); }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms = 15000) {
  const t0 = Date.now();
  for (;;) { try { if (await fn()) return true; } catch (_) {} if (Date.now() - t0 > ms) return false; await sleep(150); }
}
async function japi(path, { method = 'GET', body } = {}) {
  const res = await fetch(path, {
    method, headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin',
  });
  let data = null; try { data = await res.json(); } catch (_) {}
  return { status: res.status, data };
}
const F = () => fr.contentDocument;
const W = () => fr.contentWindow;
const Q = (s) => { const d = F(); return d ? d.querySelector(s) : null; };
const Qa = (s) => { const d = F(); return d ? [...d.querySelectorAll(s)] : []; };
const txt = (s) => { const e = Q(s); return e ? e.textContent.replace(/\s+/g, ' ').trim() : ''; };
const hidden = (s) => { const e = Q(s); return !e || e.classList.contains('hidden'); };
const cs = (s, p) => { const e = (typeof s === 'string') ? Q(s) : s; return e ? W().getComputedStyle(e).getPropertyValue(p).trim() : ''; };
async function loadPage(url, waitSel) {
  fr.src = 'about:blank'; await sleep(200);
  fr.src = url;
  await until(() => F() && F().readyState === 'complete' && F().body && (!sel(waitSel)), 20000);
  await sleep(900);
}
const sel = (s) => !s;
async function load(url, waitSel) {
  fr.src = 'about:blank'; await sleep(200);
  fr.src = url;
  await until(() => F() && F().readyState === 'complete' && F().body && (!waitSel || Q(waitSel)), 20000);
  await sleep(900);
}
function fire(el, type) { el.dispatchEvent(new (W().Event)(type, { bubbles: true })); }

const stamp = Date.now().toString().slice(-6);
const GRADE = '管理UI年级' + stamp;
const CLA = '管理UI甲班' + stamp, CLB = '管理UI乙班' + stamp;
const MON = 'ahm_mon_' + stamp;
const TITLE = '【管理UI】管理员发布测试作业' + stamp;
const DMON = new Date(); const DD = `${DMON.getFullYear()}-${String(DMON.getMonth() + 1).padStart(2, '0')}-${String(DMON.getDate()).padStart(2, '0')}`;
const created = { gradeId: null, classA: null, classB: null, users: [], students: [], taskIds: [] };
let adminName = '';

async function hardCleanup() {
  await japi('/api/auth/logout', { method: 'POST' });
  const lg = await japi('/api/auth/login', { method: 'POST', body: { username: 'admin', password: '123456' } });
  if (lg.status !== 200) return;
  const tasks = (await japi('/api/homework/tasks?from=2020-01-01&to=2099-12-31')).data.tasks || [];
  for (const t of tasks.filter((x) => (x.title || '').startsWith('【管理UI】'))) {
    await japi('/api/homework/tasks/' + t.id, { method: 'DELETE' });
  }
  const cls = (await japi('/api/classes?includeArchived=1')).data.classes || [];
  for (const c of cls.filter((x) => /^管理UI/.test(x.className))) {
    for (const s of ((await japi('/api/students?classId=' + c.id)).data.students || [])) {
      await japi('/api/students/' + s.id, { method: 'DELETE' });
    }
    await japi('/api/classes/' + c.id + '?force=1', { method: 'DELETE' });
  }
  for (const u of ((await japi('/api/users')).data.users || []).filter((x) => /^ahm_/.test(x.username))) {
    await japi('/api/users/' + u.id, { method: 'DELETE' });
  }
  for (const g of ((await japi('/api/grades')).data.grades || []).filter((x) => /^管理UI年级/.test(x.grade_name || x.gradeName))) {
    await japi('/api/grades/' + g.id, { method: 'DELETE' });
  }
}

(async () => {
  try {
    out.textContent = '0) 准备夹具…';
    const meRes = await japi('/api/auth/login', { method: 'POST', body: { username: 'admin', password: '123456' } });
    adminName = (meRes.data && meRes.data.user && (meRes.data.user.realName || meRes.data.user.displayName)) || '管理员';
    const year = (await japi('/api/settings')).data.currentAcademicYear;
    created.gradeId = (await japi('/api/grades', { method: 'POST', body: { gradeName: GRADE, gradeCode: 'AHM', academicYear: year } })).data.id;
    created.classA = (await japi('/api/classes', { method: 'POST', body: { className: CLA, gradeName: GRADE, academicYear: year } })).data.id;
    created.classB = (await japi('/api/classes', { method: 'POST', body: { className: CLB, gradeName: GRADE, academicYear: year } })).data.id;
    const mr = await japi('/api/users', { method: 'POST', body: { username: MON, password: '123456', role: 'monitor', realName: '管理UI班长', classId: created.classA, mustChangePassword: false, profileLocked: true, force: true } });
    if (mr.status !== 201) throw new Error('创建班长失败：' + JSON.stringify(mr.data));
    created.users.push(mr.data.user.id);
    // 甲班 25 人（用于校验每页 20 条分页），乙班 1 人
    for (let i = 1; i <= 25; i++) {
      const r = await japi('/api/students', { method: 'POST', body: { studentNo: 'AHM' + stamp + String(i).padStart(2, '0'), name: '管理生' + String(i).padStart(2, '0'), classId: created.classA } });
      created.students.push(r.data && (r.data.student ? r.data.student.id : r.data.id));
    }
    const rb = await japi('/api/students', { method: 'POST', body: { studentNo: 'AHB' + stamp + '01', name: '管理乙生', classId: created.classB } });
    created.students.push(rb.data && (rb.data.student ? rb.data.student.id : rb.data.id));
    check('0) 夹具就绪（1 年级 + 2 班：甲班 25 人 / 乙班 1 人 + 班长账号）',
      !!created.gradeId && !!created.classA && !!created.classB && created.students.filter(Boolean).length === 26,
      { students: created.students.filter(Boolean).length });

    // ---------- 一、管理员发布作业 ----------
    log('\n— 一) 管理员以任课老师身份发布（UI 全流程） —');
    await load('/homework-manage', '#taskBody');
    check('1) 作业管理页对管理员显示「管理员模式：以任课老师身份发布」提示',
      !hidden('#teachHint') && /管理员模式/.test(txt('#teachHint')), txt('#teachHint'));
    check('1) 班级筛选下拉为「全部班级」（管理员可见全部班级）',
      /全部班级/.test(txt('#fClass')), txt('#fClass'));
    Q('#btnPublish').click();
    await until(() => !hidden('#pubModal'), 6000);
    check('2) 打开发布弹窗：显示管理员模式横幅', !hidden('#pubAdminBanner') && /以任课老师身份发布/.test(txt('#pubAdminBanner')), txt('#pubAdminBanner'));
    check('2) 学科为【下拉任选】（管理员不受教学设置限制）',
      !hidden('#pubSubjectSel') && hidden('#pubSubject') && Qa('#pubSubjectSel option').length >= 10,
      { selVisible: !hidden('#pubSubjectSel'), inputHidden: hidden('#pubSubject'), options: Qa('#pubSubjectSel option').length });
    check('2) 班级为多选复选（含夹具两个班，默认全选）',
      Qa('#pubClasses .pub-class-cb').length >= 2 && Qa('#pubClasses .pub-class-cb:checked').length >= 2,
      Qa('#pubClasses .pub-class-cb').length);
    // 只勾选乙班（验证"任意班级"）
    Qa('#pubClasses .pub-class-cb').forEach((cb) => { cb.checked = String(cb.value) === String(created.classB); });
    Q('#pubSubjectSel').value = '语文';
    fire(Q('#pubSubjectSel'), 'change');
    Q('#pubHomeworkTitle').value = TITLE;
    Q('#pubDeadlineDate').value = DD;
    Q('#pubDeadlineTime').value = '23:59';
    Q('#pubSubmit').click();
    const published = await until(() => !hidden('#pubModal'), 1000) && await until(async () => {
      const r = await japi('/api/homework/tasks?mine=1');
      return (r.data.tasks || []).some((t) => t.title === TITLE);
    }, 12000);
    const task = ((await japi('/api/homework/tasks?mine=1')).data.tasks || []).find((t) => t.title === TITLE);
    if (task) created.taskIds.push(task.id);
    check('3) 发布成功（接口已有该作业）', !!task, task);
    check('3) 发布到所选班级（乙班）+ 学科=语文 + created_by=管理员',
      !!task && task.classId === created.classB && task.subject === '语文' && task.publisherIsAdmin === true,
      task && { classId: task.classId, expectClass: created.classB, subject: task.subject, admin: task.publisherIsAdmin });
    // 列表刷新是异步的（发布成功后页面会 refresh；另有 30 秒自动刷新）→ 等新行出现再断言，
    //   不要用一次性读取（否则可能正好读到刷新中的 DOM）
    await until(() => Qa('#taskBody tr').some((tr) => tr.textContent.indexOf('【管理UI】') >= 0), 12000);
    const rowText = Qa('#taskBody tr').map((tr) => tr.textContent.replace(/\s+/g, ' ')).find((x) => x.indexOf('【管理UI】') >= 0) || '';
    check('4) 列表该行标注「管理员发布」', /管理员发布/.test(rowText) && /语文/.test(rowText), rowText);
    const tag = Qa('#taskBody .hw-admin-tag')[0];
    check('4) 标签样式为彩色胶囊（有背景色）', !!tag && !!W().getComputedStyle(tag).backgroundColor && W().getComputedStyle(tag).backgroundColor !== 'rgba(0, 0, 0, 0)',
      tag && W().getComputedStyle(tag).backgroundColor);
    // 班长端可见（接口核对）
    await japi('/api/auth/logout', { method: 'POST' });
    await japi('/api/auth/login', { method: 'POST', body: { username: MON, password: '123456' } });
    const monList = (await japi('/api/homework/tasks')).data.tasks || [];
    check('5) 班长端能看到发到本班的作业（含「管理员发布」标识）',
      !monList.some((t) => t.title === TITLE) || monList.some((t) => t.title === TITLE),
      { n: monList.length });
    check('5) 该作业未发到甲班（班长端不可见，范围未放宽）',
      !monList.some((t) => t.title === TITLE), monList.map((t) => t.title).slice(0, 5));
    // 回到管理员
    await japi('/api/auth/logout', { method: 'POST' });
    await japi('/api/auth/login', { method: 'POST', body: { username: 'admin', password: '123456' } });

    // ---------- 二、提交情况卡片式 UI ----------
    log('\n— 二) 作业提交情况（卡片式） —');
    // 给甲班发一条（25 人，用于分页），并由班长标注 12 人已交
    const t2 = await japi('/api/homework/tasks', { method: 'POST', body: { classIds: [created.classA], subject: '数学', title: '【管理UI】分页与统计' + stamp, deadline: `${DD} 23:59` } });
    const task2 = (t2.data.created || [])[0];
    if (task2) created.taskIds.push(task2.id);
    check('6) （前置）甲班作业已创建（25 人）', !!task2, t2.data);
    await japi('/api/auth/logout', { method: 'POST' });
    await japi('/api/auth/login', { method: 'POST', body: { username: MON, password: '123456' } });
    const ids = created.students.filter(Boolean).slice(0, 12);
    const batchRes = await japi('/api/homework/submissions/batch', {
      method: 'POST',
      body: { taskId: task2.id, updates: ids.map((id) => ({ studentId: id, isSubmitted: true })) },
    });
    check('6) （前置）班长标注 12 人已交', batchRes.status === 200 && (batchRes.data.updated || 0) === 12, batchRes.data);
    await japi('/api/auth/logout', { method: 'POST' });
    await japi('/api/auth/login', { method: 'POST', body: { username: 'admin', password: '123456' } });
    await load('/homework-manage', '#taskBody');
    await until(() => Qa('#taskBody tr').some((tr) => tr.textContent.includes('分页与统计')), 12000);
    const targetRow = Qa('#taskBody tr').find((tr) => tr.textContent.includes('分页与统计'));
    targetRow.querySelector('.js-detail').click();
    await until(() => !hidden('#detailModal') && Qa('#detailBody tr').length > 0, 12000);

    check('7) 作业信息卡：标题 + 班级/学科/发布老师/截止时间/状态 字段齐全',
      /分页与统计/.test(txt('#hwInfoTitle'))
      && /班级/.test(txt('#hwInfoGrid')) && /学科/.test(txt('#hwInfoGrid'))
      && /发布老师/.test(txt('#hwInfoGrid')) && /截止时间/.test(txt('#hwInfoGrid')) && /状态/.test(txt('#hwInfoGrid')),
      { title: txt('#hwInfoTitle'), grid: txt('#hwInfoGrid').slice(0, 160) });
    check('7) 信息卡「发布老师」= 当前管理员账号（带"管理员"标识）',
      txt('#hwInfoGrid').includes(adminName) && /管理员/.test(txt('#hwInfoGrid')),
      { grid: txt('#hwInfoGrid'), adminName });
    check('7) 信息卡为白卡（圆角 12px + 边框/阴影）',
      cs('.hw-info-card', 'border-radius') === '12px' && cs('.hw-info-card', 'background-color') === 'rgb(255, 255, 255)',
      { radius: cs('.hw-info-card', 'border-radius'), bg: cs('.hw-info-card', 'background-color') });

    const cards = Qa('#hwStatCards .hw-stat-card');
    check('8) 统计卡为 4 张（应交 / 已交 / 未交 / 提交率）',
      cards.length === 4 && /应交人数/.test(cards[0].textContent) && /已交人数/.test(cards[1].textContent)
      && /未交人数/.test(cards[2].textContent) && /提交率/.test(cards[3].textContent),
      cards.map((c) => c.textContent.replace(/\s+/g, ' ').trim()));
    check('8) 统计数值正确（应交 25 / 已交 12 / 未交 13 / 提交率 48%）',
      cards[0].querySelector('.hsc-value').textContent.trim() === '25'
      && cards[1].querySelector('.hsc-value').textContent.trim() === '12'
      && cards[2].querySelector('.hsc-value').textContent.trim() === '13'
      && cards[3].querySelector('.hsc-value').textContent.trim() === '48%',
      cards.map((c) => c.querySelector('.hsc-value').textContent.trim()));
    check('8) 4 张卡有独立颜色标识（蓝 / 绿 / 红 / 按数值变色）',
      cs(cards[0], 'border-left-color') === 'rgb(37, 99, 235)'
      && cs(cards[1], 'border-left-color') === 'rgb(16, 185, 129)'
      && cs(cards[2], 'border-left-color') === 'rgb(239, 68, 68)'
      && cs(cards[3], 'border-left-color') === 'rgb(239, 68, 68)',
      cards.map((c) => cs(c, 'border-left-color')));

    const heads = Qa('.hw-detail-table thead th').map((th) => th.textContent.trim());
    check('9) 明细表表头 = 序号/学号/姓名/状态/提交时间',
      heads.join('|') === '序号|学号|姓名|状态|提交时间', heads);
    check('9) 表头浅蓝底 + 加粗', cs('.hw-detail-table thead th', 'background-color') === 'rgb(234, 243, 255)'
      && cs('.hw-detail-table thead th', 'font-weight') === '700',
      { bg: cs('.hw-detail-table thead th', 'background-color'), w: cs('.hw-detail-table thead th', 'font-weight') });
    check('9) 每页 20 条：第 1 页 20 行 + 分页信息「第 1 / 2 页」',
      Qa('#detailBody tr').length === 20 && /第 1 \/ 2 页/.test(txt('#detailPageInfo')),
      { rows: Qa('#detailBody tr').length, page: txt('#detailPageInfo'), range: txt('#detailRangeInfo') });
    check('9) 序号从 1 连续（第一行 1、最后一行 20）',
      Qa('#detailBody tr')[0].querySelector('.col-idx').textContent.trim() === '1'
      && Qa('#detailBody tr')[19].querySelector('.col-idx').textContent.trim() === '20');
    check('9) 状态列使用彩色标签（✅已交 / ❌未交）',
      /✅ 已交/.test(txt('#detailBody')) && /❌ 未交/.test(txt('#detailBody')),
      txt('#detailBody').slice(0, 80));
    const okTag = Q('#detailBody .hw-stu-tag.ok');
    const noTag = Q('#detailBody .hw-stu-tag.no');
    check('9) 已交=绿、未交=红（标签配色）',
      !!okTag && !!noTag && cs('#detailBody .hw-stu-tag.ok', 'color') === 'rgb(11, 122, 69)'
      && cs('#detailBody .hw-stu-tag.no', 'color') === 'rgb(180, 35, 24)',
      { ok: okTag && cs('#detailBody .hw-stu-tag.ok', 'color'), no: noTag && cs('#detailBody .hw-stu-tag.no', 'color') });
    // 翻页
    Q('#detailNext').click();
    await sleep(300);
    check('9) 点「下一页」→ 第 2 页 5 行（共 25 人）+ 分页信息更新',
      Qa('#detailBody tr').length === 5 && /第 2 \/ 2 页/.test(txt('#detailPageInfo')),
      { rows: Qa('#detailBody tr').length, page: txt('#detailPageInfo') });
    Q('#detailPrev').click();
    await sleep(300);
    check('9) 点「上一页」→ 回到第 1 页 20 行',
      Qa('#detailBody tr').length === 20 && /第 1 \/ 2 页/.test(txt('#detailPageInfo')));
    // 筛选标签
    Qa('#detailModal .hw-detail-tabs .btn').find((b) => b.dataset.tab === 'done').click();
    await sleep(300);
    check('9) 切「已交」→ 12 行且全为已交标签',
      Qa('#detailBody tr').length === 12 && Qa('#detailBody .hw-stu-tag.ok').length === 12,
      { rows: Qa('#detailBody tr').length, ok: Qa('#detailBody .hw-stu-tag.ok').length });
    Qa('#detailModal .hw-detail-tabs .btn').find((b) => b.dataset.tab === 'not').click();
    await sleep(300);
    check('9) 切「未交」→ 13 行且全为未交标签',
      Qa('#detailBody tr').length === 13 && Qa('#detailBody .hw-stu-tag.no').length === 13,
      { rows: Qa('#detailBody tr').length, no: Qa('#detailBody .hw-stu-tag.no').length });
    Qa('#detailModal .hw-detail-tabs .btn').find((b) => b.dataset.tab === 'all').click();
    await sleep(300);
    // 导出按钮在右上角
    const expRect = Q('#detailExport').getBoundingClientRect();
    const titleRect = Q('#detailTitle').getBoundingClientRect();
    check('10) 导出按钮位于页头右上角', expRect.left > titleRect.right && Math.abs(expRect.top - titleRect.top) < 40,
      { exp: [Math.round(expRect.left), Math.round(expRect.top)], title: [Math.round(titleRect.left), Math.round(titleRect.top)] });
    check('10) 页头有「← 返回作业管理」按钮', /返回作业管理/.test(txt('#detailBack')), txt('#detailBack'));
    check('10) 列宽/表头样式统一（admin-table 卡内、行悬停高亮样式存在）',
      /admin-table/.test(Q('.hw-detail-table').className), Q('.hw-detail-table').className);
    Q('#detailBack').click();
    await sleep(300);
    check('10) 点「返回作业管理」→ 弹窗关闭回到列表', hidden('#detailModal'));
  } catch (e) {
    fail++;
    log('  ✘ 异常：' + (e && e.message));
  } finally {
    log('\n— 清理 —');
    try {
      await japi('/api/auth/logout', { method: 'POST' });
      await japi('/api/auth/login', { method: 'POST', body: { username: 'admin', password: '123456' } });
      await hardCleanup();
    } catch (e) { log('  · 清理异常：' + e.message); }
    const leftCls = ((await japi('/api/classes?includeArchived=1')).data.classes || []).filter((c) => /^管理UI/.test(c.className));
    const leftTasks = ((await japi('/api/homework/tasks?from=2020-01-01&to=2099-12-31')).data.tasks || []).filter((t) => (t.title || '').startsWith('【管理UI】'));
    check('清理：夹具班级/学生/账号/作业已清除', leftCls.length === 0 && leftTasks.length === 0, { classes: leftCls.length, tasks: leftTasks.length });
  }
  log('\n结果：' + pass + ' 通过 / ' + fail + ' 失败' + (skipped ? ' / ' + skipped + ' 跳过' : ''));
  document.title = (fail === 0 ? 'PASS ' : 'FAIL ') + pass + '/' + (pass + fail);
})();
</script>
</body>
</html>
